<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="920" viewBox="0 0 2200 920" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aGrey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7d848f"/>
    </marker>
  </defs>

  <rect width="2200" height="920" fill="#ffffff"/>

  <!-- lanes -->
  <rect x="40" y="60"  width="2130" height="180" rx="14" fill="#FFFCF7" stroke="#E8A33D" stroke-width="2.5"/>
  <rect x="40" y="300" width="2130" height="180" rx="14" fill="#FAFCFF" stroke="#4A7FD4" stroke-width="2.5"/>
  <rect x="40" y="540" width="2130" height="180" rx="14" fill="#FAFEFB" stroke="#3DA96A" stroke-width="2.5"/>

  <!-- lane labels -->
  <text x="64" y="120" font-size="27" font-weight="700" fill="#8a5a12" letter-spacing="1">ANALYST</text>
  <text x="64" y="152" font-size="19" fill="#a8792f">asks and decides</text>

  <text x="64" y="360" font-size="27" font-weight="700" fill="#24508f" letter-spacing="1">AGENT</text>
  <text x="64" y="392" font-size="19" font-weight="700" fill="#4A7FD4">TRANSLATES,</text>
  <text x="64" y="416" font-size="19" font-weight="700" fill="#4A7FD4">NEVER COMPUTES</text>

  <text x="64" y="600" font-size="27" font-weight="700" fill="#1f6b41" letter-spacing="1">SOLVER &amp; PROOF</text>
  <text x="64" y="632" font-size="19" font-weight="700" fill="#3DA96A">COMPUTES,</text>
  <text x="64" y="656" font-size="19" font-weight="700" fill="#3DA96A">NEVER GUESSES</text>

  <!-- arrows -->
  <g fill="none" stroke="#7d848f" stroke-width="2.6" marker-end="url(#aGrey)">
    <path d="M 377.5,205 V 256 Q 377.5,270 391.5,270 H 566.5 Q 580.5,270 580.5,284 V 340"/>
    <path d="M 650.5,340 V 284 Q 650.5,270 664.5,270 H 804.5 Q 818.5,270 818.5,256 V 205"/>
    <path d="M 888.5,205 V 256 Q 888.5,270 902.5,270 H 1077.5 Q 1091.5,270 1091.5,284 V 340"/>
    <path d="M 1091.5,445 V 496 Q 1091.5,510 1105.5,510 H 1315.5 Q 1329.5,510 1329.5,524 V 580"/>
    <path d="M 1437,632.5 H 1458"/>
    <path d="M 1567.5,580 V 524 Q 1567.5,510 1581.5,510 H 1791.5 Q 1805.5,510 1805.5,496 V 445"/>
    <path d="M 1805.5,340 V 284 Q 1805.5,270 1819.5,270 H 2029.5 Q 2043.5,270 2043.5,256 V 205"/>
  </g>

  <!-- arrow labels -->
  <rect x="642" y="238" width="185" height="30" rx="6" fill="#ffffff"/>
  <text x="734.5" y="260" font-size="20" font-weight="600" fill="#D24A4A" text-anchor="middle">stops and asks you</text>
  <rect x="900" y="238" width="180" height="30" rx="6" fill="#ffffff"/>
  <text x="990" y="260" font-size="20" font-weight="600" fill="#2b8351" text-anchor="middle">confirmed numbers</text>

  <!-- step boxes: lane A -->
  <g>
    <rect x="270" y="100" width="215" height="105" rx="12" fill="#FFF4E6" stroke="#E8A33D" stroke-width="2.5"/>
    <circle cx="292" cy="122" r="15" fill="#E8A33D"/><text x="292" y="129" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="377.5" y="163" font-size="21" fill="#1c2430" text-anchor="middle">Upload your data</text>
    <text x="377.5" y="190" font-size="21" fill="#1c2430" text-anchor="middle">Ask in plain English</text>
  </g>
  <g>
    <rect x="746" y="100" width="215" height="105" rx="12" fill="#FFF4E6" stroke="#E8A33D" stroke-width="3.5"/>
    <circle cx="768" cy="122" r="15" fill="#E8A33D"/><text x="768" y="129" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="853.5" y="163" font-size="21" font-weight="700" fill="#1c2430" text-anchor="middle">Answer up to</text>
    <text x="853.5" y="190" font-size="21" font-weight="700" fill="#1c2430" text-anchor="middle">6 questions</text>
  </g>
  <g>
    <rect x="1936" y="100" width="215" height="105" rx="12" fill="#FFF4E6" stroke="#E8A33D" stroke-width="2.5"/>
    <circle cx="1958" cy="122" r="15" fill="#E8A33D"/><text x="1958" y="129" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
    <text x="2043.5" y="163" font-size="21" fill="#1c2430" text-anchor="middle">Decide, with</text>
    <text x="2043.5" y="190" font-size="21" fill="#1c2430" text-anchor="middle">the evidence</text>
  </g>

  <!-- step boxes: lane B -->
  <g>
    <rect x="508" y="340" width="215" height="105" rx="12" fill="#EEF4FF" stroke="#4A7FD4" stroke-width="2.5"/>
    <circle cx="530" cy="362" r="15" fill="#4A7FD4"/><text x="530" y="369" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="615.5" y="403" font-size="21" fill="#1c2430" text-anchor="middle">Read and profile</text>
    <text x="615.5" y="430" font-size="21" fill="#1c2430" text-anchor="middle">every column</text>
  </g>
  <g>
    <rect x="984" y="340" width="215" height="105" rx="12" fill="#EEF4FF" stroke="#4A7FD4" stroke-width="2.5"/>
    <circle cx="1006" cy="362" r="15" fill="#4A7FD4"/><text x="1006" y="369" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="1091.5" y="403" font-size="21" fill="#1c2430" text-anchor="middle">Write the model</text>
    <text x="1091.5" y="430" font-size="21" fill="#1c2430" text-anchor="middle">goal + every rule</text>
  </g>
  <g>
    <rect x="1698" y="340" width="215" height="105" rx="12" fill="#EEF4FF" stroke="#4A7FD4" stroke-width="2.5"/>
    <circle cx="1720" cy="362" r="15" fill="#4A7FD4"/><text x="1720" y="369" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
    <text x="1805.5" y="403" font-size="21" fill="#1c2430" text-anchor="middle">Explain it in</text>
    <text x="1805.5" y="430" font-size="21" fill="#1c2430" text-anchor="middle">plain language</text>
  </g>

  <!-- step boxes: lane C -->
  <g>
    <rect x="1222" y="580" width="215" height="105" rx="12" fill="#EEFAF1" stroke="#3DA96A" stroke-width="2.5"/>
    <circle cx="1244" cy="602" r="15" fill="#3DA96A"/><text x="1244" y="609" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="1329.5" y="643" font-size="21" fill="#1c2430" text-anchor="middle">Prove the optimum</text>
    <text x="1329.5" y="670" font-size="21" fill="#1c2430" text-anchor="middle">OR-Tools / SciPy</text>
  </g>
  <g>
    <rect x="1460" y="580" width="215" height="105" rx="12" fill="#EEFAF1" stroke="#3DA96A" stroke-width="3.5"/>
    <circle cx="1482" cy="602" r="15" fill="#3DA96A"/><text x="1482" y="609" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <text x="1567.5" y="643" font-size="21" font-weight="700" fill="#1c2430" text-anchor="middle">Re-check every rule</text>
    <text x="1567.5" y="670" font-size="21" font-weight="700" fill="#1c2430" text-anchor="middle">outside the solver</text>
  </g>

  <!-- deliverables band -->
  <rect x="40" y="770" width="2130" height="112" rx="14" fill="#F4F6F9" stroke="#c3c9d2" stroke-width="2"/>
  <text x="64" y="812" font-size="21" font-weight="700" fill="#5a6270" letter-spacing="1.5">EVERY RUN SHIPS THE EVIDENCE</text>
  <text x="64" y="852" font-size="24" fill="#3a4250">report.md &#160;&#183;&#160; decision.csv &#160;&#183;&#160; constraints.csv &#160;&#183;&#160; model.py &#160;&#183;&#160; workbench.duckdb &#8212; every row, every query, re-runnable</text>
</svg>
